<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sniffing through..</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: "Courier New", Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #1a1f18;
            color: #88cc88;
            background-image: radial-gradient(circle, #1a1f18 0%, #0d120a 100%);
        }
        .card { 
            text-align: center; 
            padding: 40px 30px; 
            background: #252b22; 
            border-radius: 8px; 
            border: 2px solid #4a7c2a;
            box-shadow: 0 0 20px rgba(74, 124, 42, 0.4); 
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #73d936;
            text-shadow: 0 0 5px #73d936;
        }
        p {
            font-weight: bold;
        }
        .btn { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 12px 24px; 
            background-color: #4a7c2a; 
            color: #111; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: 900; 
            text-transform: uppercase;
            border: 1px solid #73d936;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(115, 217, 54, 0.5);
        }
        .btn:hover { 
            background-color: #73d936; 
            color: #000;
            box-shadow: 0 0 15px #73d936;
            cursor: pointer;
        }
        .note {
            font-size: 0.85em;
            color: #557a46;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Email Redirection</h2>
        <p>If your Email client does not open automatically, please click the button below to compose your message.</p>
        <a href="mailto:muskydemon@gmail.com" class="btn">Send Email</a>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = "mailto:muskydemon@gmail.com";
        }, 1500);
    </script>
</body>
</html>
